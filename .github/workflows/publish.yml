# Stages the package to npm when a version tag (v*) is pushed.
#
# This workflow only STAGES — a maintainer must then review and approve
# the staged package with 2FA before it goes live:
#
#   npm stage list                    # find the stage id
#   npm stage view    <stage-id>
#   npm stage approve <stage-id>     # 2FA → published
#
# …or click Approve in npmjs.com → Staged Packages.
#
# Staging setup — do ONE of these before the first `git push --tags`:
#
#   A. Trusted publishing (recommended, no secrets):
#      On npmjs.com → package settings, connect this repository
#      (owner: abmach, repo: mote, workflow: publish.yml).
#      The `id-token: write` permission below lets npm stage via OIDC.
#
#   B. Stage-only token:
#      Create a granular access token of type "Read and write (stage only)"
#      on npmjs.com and add it as the NPM_TOKEN secret. Such tokens can
#      stage but never publish directly — approval is always human.

name: Stage release to npm

on:
  push:
    tags: ["v*"]

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Sanity gate: the tag must match package.json
      - name: Check tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Stage to npm
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Approval reminder
        run: |
          echo "::notice::Staged ${GITHUB_REF_NAME}. A maintainer must now approve it:"
          echo "::notice::npm stage list && npm stage approve <stage-id>  (2FA required)"
