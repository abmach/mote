# Stage the package to npm when a version tag (v*) is pushed.
#
# This workflow only STAGES — a maintainer must then review and approve
# the staged package with 2FA before it goes live:
#
#   npm stage list                    # find the stage id
#   npm stage view    <stage-id>
#   npm stage approve <stage-id>     # 2FA → published
#
# …or click Approve in npmjs.com → Staged Packages.
#
# Staging setup — do ONE of these before the first `git push --tags`:
#
#   A. Trusted publishing (recommended, no secrets):
#      On npmjs.com → package settings, connect this repository
#      (owner: abmach, repo: mote, workflow: publish.yml).
#      The `id-token: write` permission below lets npm stage via OIDC.
#
#   B. Stage-only token:
#      Create a granular access token of type "Read and write (stage only)"
#      on npmjs.com and add it as the NPM_TOKEN secret. Such tokens can
#      stage but never publish directly — approval is always human.
#
# Tags whose version is already on the registry (e.g. re-pushed or
# retroactive tags) are skipped gracefully.

name: Stage release to npm

on:
  push:
    tags: ["v*"]

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Determine whether to stage
        id: check
        run: |
          if [ ! -f package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json at this tag — skipping (pre-release tag)."
            exit 0
          fi
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          if npm view "mote.css@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is already on the registry — skipping staging."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stage to npm
        if: steps.check.outputs.skip != 'true'
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Approval reminder
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "::notice::Staged ${GITHUB_REF_NAME}. A maintainer must now approve it:"
          echo "::notice::npm stage list && npm stage approve <stage-id>  (2FA required)"
